<!doctype html>
<!--
  OG share card — Fraser Gorrie. Durable, regenerable SOURCE for fgw-26/public/og-image.jpg
  (sitewide og:image / twitter:image, 1200x630; also the X pinned-post image). Created Conv 038,
  augmented Conv 038: name + "MSc" (eyebrow treatment: Inter, ember, mixed-case, 20px right of
  "Gorrie"); tagline "Custom Software - Over 40 years / Built with AI for speed / Steered by me for
  quality"; circular headshot (right) from fraser-src.jpg (copy of fgw-26/src/assets/fraser.jpg).
  Warm-orange brand card, Fraunces (name) + Inter (rest), cream text, ember accents.

  Requires fraser-src.jpg beside this file. To re-export:
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,630 --virtual-time-budget=3000 --screenshot=og-image.png og-image.html
    sips -s format jpeg -s formatOptions 85 og-image.png --out og-image.jpg
    sips -z 630 1200 og-image.jpg
    # then copy og-image.jpg -> fgw-26/public/og-image.jpg and redeploy.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;background:#1b1712;} svg{display:block;}</style>
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.85">
        <stop offset="0" stop-color="#cc6e19"/>
        <stop offset="1" stop-color="#5f3109"/>
      </linearGradient>
      <clipPath id="pc"><circle cx="990" cy="300" r="150"/></clipPath>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)"/>
    <image href="fraser-src.jpg" x="738" y="150" width="450" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc)"/>
    <circle cx="990" cy="300" r="150" fill="none" stroke="#f3e7d2" stroke-width="6" opacity="0.92"/>
    <text x="88" y="194" font-family="'Fraunces',Georgia,serif" font-weight="600" font-size="90" fill="#f7efe1">Fraser Gorrie<tspan dx="20" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="34" letter-spacing="1" fill="#f0a53f">MSc</tspan></text>
    <text x="90" y="300" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="40" fill="#f2e6d1">Custom Software <tspan fill="#f0a53f">&#8226;</tspan> Over 40 years</text>
    <text x="90" y="356" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="40" fill="#f2e6d1">Built with AI for speed</text>
    <text x="90" y="412" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="40" fill="#f2e6d1">Steered by me for quality</text>
    <text x="90" y="560" font-family="'Inter',system-ui,sans-serif" font-weight="500" font-size="30" fill="#e8d0a6">frasergorrie.com</text>
  </svg>
</body>
</html>
