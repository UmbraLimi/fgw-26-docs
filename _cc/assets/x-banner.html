<!doctype html>
<!--
  X.com header — Fraser Gorrie. Created Conv 037. Same design as the LinkedIn banner
  (Concept 1 / B1, chosen Conv 036), refit to X's 1500x500 (3:1). Site warm-dark + Fraunces/Inter + ember.
  Durable, regenerable SOURCE. To re-export the upload PNG (2x, 3000x1000):
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1500,500 --virtual-time-budget=3000 \
      --screenshot=x-banner.png x-banner.html
  X header is 1500x500 (3:1); content kept right-of-centre + vertically centred so the
  profile photo (lower-left) stays clear. Derived from linkedin-banner.html (4:1).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; padding:0; background:#1b1712; }
  svg { display:block; }
</style>
</head>
<body>
  <svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
    <rect width="1500" height="500" fill="#1b1712"/>
    <text x="1000" y="415" text-anchor="middle" font-family="'Fraunces',Georgia,serif" font-weight="600" font-size="380" fill="#262019">FG</text>
    <text x="1000" y="250" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-weight="600" font-size="26" letter-spacing="6" fill="#cabfb0">SOFTWARE DEVELOPER &#160;&#183;&#160; 1982 <tspan fill="#f0a53f">&#8594; AI</tspan></text>
    <rect x="840" y="272" width="320" height="2" fill="#f0a53f" opacity="0.7"/>
  </svg>
</body>
</html>
